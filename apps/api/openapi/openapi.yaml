  /links:
    get:
      description: "Returns one page of the link inventory, each row carrying its visit aggregates for the requested window, plus the total the filters match. Search, status and sort all resolve in the database: the inventory grows without bound, so a client that filtered its own page would only ever search the rows it happened to be holding."
      operationId: list-links
      parameters:
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            minimum: 1
            type: integer
        - description: rows per page (1-100)
          explode: false
          in: query
          name: per_page
          schema:
            default: 20
            description: rows per page (1-100)
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: case-insensitive substring of the alias, destination or description
          explode: false
          in: query
          name: q
          schema:
            description: case-insensitive substring of the alias, destination or description
            maxLength: 200
            type: string
        - description: 0=active 1=disabled 2=archived, -1=any
          explode: false
          in: query
          name: status
          schema:
            default: -1
            description: 0=active 1=disabled 2=archived, -1=any
            format: int64
            maximum: 2
            minimum: -1
            type: integer
        - description: range=in-window visits, total=all-time visits, created=newest first, alias=A-Z
          explode: false
          in: query
          name: sort
          schema:
            default: range
            description: range=in-window visits, total=all-time visits, created=newest first, alias=A-Z
            enum:
              - range
              - total
              - created
              - alias
            type: string
        - description: days the per-row visit aggregates cover
          explode: false
          in: query
          name: range
          schema:
            default: 7
            description: days the per-row visit aggregates cover
            format: int64
            maximum: 30
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkListOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: List short links (one page, filtered and sorted server-side)
      tags:
        - links
    post:
      operationId: create-link
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLinkBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDTO"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Create a short link
      tags:
        - links
