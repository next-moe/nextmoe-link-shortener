# Dokploy production compose (reference — the live copy lives in the Dokploy
# panel; secrets are injected there, never committed).
#
# Topology (ecosystem convention):
#   - web is the only exposed service; Traefik routes the site domain to
#     :3000. Nitro route rules proxy /api/** and /s/** to the api container,
#     so browsers, products' users, and short-link visitors all enter through
#     one origin.
#   - api is internal-only (S2S callers on the same Docker network can reach
#     http://api:7845 directly if colocated; external products go through
#     the public origin).
#   - Postgres is the HOST's own instance (ecosystem convention: one Postgres,
#     each domain its own database) — reached via host.docker.internal.
#     Create the kun_shortlink database + role before first deploy.
#   - Redis rides this compose (sessions only; losing it = everyone re-logs).
#
# Images are pushed by .github/workflows/build.yml; pin :sha tags in the
# panel for reproducible rollbacks (infra convention).
name: kungal-link-shortener

services:
  api:
    image: ghcr.io/kungal/shortlink-api:latest
    restart: unless-stopped
    environment:
      SHORTLINK_MODE: prod
      SHORTLINK_HOST: 0.0.0.0
      SHORTLINK_PORT: '7845'
      # host Postgres; set the real password in the Dokploy panel env.
      SHORTLINK_DB_DSN: ${SHORTLINK_DB_DSN}
      SHORTLINK_PUBLIC_BASE_URL: ${SHORTLINK_PUBLIC_BASE_URL}
      SHORTLINK_ADMIN_ROLES: ${SHORTLINK_ADMIN_ROLES:-admin}
      SHORTLINK_OIDC_ISSUER: ${SHORTLINK_OIDC_ISSUER}
      SHORTLINK_OIDC_CLIENT_ID: ${SHORTLINK_OIDC_CLIENT_ID}
      SHORTLINK_OIDC_CLIENT_SECRET: ${SHORTLINK_OIDC_CLIENT_SECRET}
      SHORTLINK_OIDC_REDIRECT_URI: ${SHORTLINK_OIDC_REDIRECT_URI}
      SHORTLINK_REDIS_ADDR: redis:6379
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      - redis

  web:
    image: ghcr.io/kungal/shortlink-web:latest
    restart: unless-stopped
  web:
    # The /api and /s proxy target (http://api:7845) is baked into this image
    # at build time (docker/web.Dockerfile ARG API_PROXY_TARGET) — keep the
    # api service name stable.
    image: ghcr.io/kungal/shortlink-web:latest
    restart: unless-stopped
    ports:
      - '3000'
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

volumes:
  redis-data:
