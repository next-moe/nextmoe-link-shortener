# Local development backing services: Postgres + Redis only (the API and web
# run from source via `pnpm dev`). Ports and credentials come from the
# repo-root .env (see .env.example). The compose file lives under docker/, so
# interpolation must be pointed at the repo-root env file:
#
#   docker compose --env-file .env -f docker/compose.dev.yml up -d --wait
name: shortlink-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SHORTLINK_POSTGRES_USER:-shortlink}
      POSTGRES_PASSWORD: ${SHORTLINK_POSTGRES_PASSWORD:-shortlink_dev_password}
      POSTGRES_DB: ${SHORTLINK_POSTGRES_DB:-kun_shortlink}
    ports:
      - '127.0.0.1:${SHORTLINK_POSTGRES_PORT:-7846}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SHORTLINK_REDIS_PORT:-7847}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  postgres-data:
  redis-data:
